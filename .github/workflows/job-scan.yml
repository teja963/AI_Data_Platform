name: Scan career sites

on:
  schedule:
    # Run hourly; the scanner selects a small due batch so each source refreshes
    # approximately every 12 hours without hitting every career site at once.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: career-site-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DB_URL || secrets.NEON_DATABASE_URL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-scanner.txt

      - name: Install scanner dependencies
        run: python -m pip install --requirement requirements-scanner.txt

      - name: Verify scanner database configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Scanner skipped: add the PostgreSQL connection URL as the DATABASE_URL repository secret."
            echo "### Job scan skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The DATABASE_URL repository secret is missing." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Scan public career sites
        if: env.DATABASE_URL != ''
        run: python scripts/run_job_scanner.py
