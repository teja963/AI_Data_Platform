name: Scan career sites

on:
  schedule:
    # Run hourly; the scanner selects a due batch sized so each source refreshes
    # approximately every 12 hours without hitting every career site at once.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: career-site-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DB_URL || secrets.NEON_DATABASE_URL }}
      JOB_SCAN_BATCH_SIZE: ${{ vars.JOB_SCAN_BATCH_SIZE || '48' }}
      JOB_SCAN_WORKERS: ${{ vars.JOB_SCAN_WORKERS || '8' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-scanner.txt

      - name: Install scanner dependencies
        run: python -m pip install --requirement requirements-scanner.txt

      - name: Verify scanner database configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the PostgreSQL connection URL as the DATABASE_URL repository secret."
            echo "### Job scan failed" >> "$GITHUB_STEP_SUMMARY"
            echo "The DATABASE_URL repository secret is missing." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Scan public career sites
        if: env.DATABASE_URL != ''
        run: |
          for attempt in 1 2 3; do
            if python scripts/run_job_scanner.py; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Scanner infrastructure failed after 3 attempts."
              exit 1
            fi
            echo "::warning::Scanner infrastructure attempt $attempt failed; retrying."
            sleep $((attempt * 10))
          done
