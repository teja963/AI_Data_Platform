name: Scan career sites

on:
  schedule:
    # GitHub cron uses UTC: 02:00/14:00 UTC = 07:30/19:30 IST.
    - cron: "0 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: career-site-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-scanner.txt

      - name: Install scanner dependencies
        run: python -m pip install --requirement requirements-scanner.txt

      - name: Verify scanner database configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "GitHub repository secret DATABASE_URL is required." >&2
            exit 1
          fi

      - name: Scan public career sites
        run: python scripts/run_job_scanner.py
